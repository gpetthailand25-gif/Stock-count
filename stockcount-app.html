<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOCKCOUNT — ระบบนับสต็อกสิ้นเดือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#14161A;
  --surface:#1B1E24;
  --surface2:#23272F;
  --surface3:#2A2F38;
  --border:#2E333D;
  --border-soft:#262A32;
  --text:#E8E9EC;
  --text-dim:#9198A6;
  --text-faint:#5B6472;
  --amber:#F5A623;
  --amber-dim:#8A5E1E;
  --green:#37B24D;
  --green-bg:#16321D;
  --red:#E5484D;
  --red-bg:#3A1719;
  --blue:#4C9AFF;
  --blue-bg:#122238;
  --gray:#5B6472;
  --gray-bg:#20242B;
  --radius:10px;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Noto Sans Thai','IBM Plex Mono',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber); color:#14161A;}

/* ---- hazard stripe signature ---- */
.hazard{
  height:6px;
  width:100%;
  background:repeating-linear-gradient(135deg, var(--amber), var(--amber) 10px, #14161A 10px, #14161A 20px);
  opacity:0.9;
}

/* ---- layout ---- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:20px 18px 16px 18px;
  border-bottom:1px solid var(--border);
}
.brand .mark{
  font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:0.12em;
  color:var(--amber);
}
.brand .name{font-size:16px; font-weight:700; margin-top:4px;}
.brand .sub{font-size:11px; color:var(--text-faint); margin-top:2px; font-family:var(--mono);}

.nav{padding:12px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); padding:14px 10px 6px 10px; font-family:var(--mono);}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  border:1px solid transparent;
  transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--surface3); color:var(--text); border-color:var(--border);}
.nav-item.active .dot{background:var(--amber);}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
.nav-item .count{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); background:var(--surface); padding:1px 6px; border-radius:20px;}

.sidebar-foot{padding:14px 18px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint); font-family:var(--mono);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:10;
  background:rgba(20,22,26,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:14px 28px;
}
.topbar-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.page-title{font-size:19px; font-weight:700; margin-right:auto;}
.page-title .sub{display:block; font-size:12px; font-weight:400; color:var(--text-faint); margin-top:2px;}

.filter{
  display:flex; flex-direction:column; gap:3px;
}
.filter label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-family:var(--mono);}
.filter select{
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:7px 10px; border-radius:7px; font-size:12.5px; font-family:var(--sans);
  min-width:140px; cursor:pointer;
}
.filter select:focus{outline:2px solid var(--amber); outline-offset:1px;}

.content{padding:24px 28px 60px 28px;}
.section{display:none;}
.section.active{display:block; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:28px 0 12px 0; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}
.section-title .line{flex:1; height:1px; background:var(--border);}

/* ---- KPI cards ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px;}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; position:relative; overflow:hidden;
}
.kpi .label{font-size:11.5px; color:var(--text-faint); font-weight:600;}
.kpi .value{font-family:var(--mono); font-size:26px; font-weight:600; margin-top:6px; letter-spacing:-0.01em;}
.kpi .unit{font-size:12px; color:var(--text-faint); font-weight:400; margin-left:3px;}
.kpi .delta{font-size:11px; margin-top:6px; color:var(--text-dim); font-family:var(--mono);}
.kpi.accent-amber{border-color:var(--amber-dim);}
.kpi.accent-amber .value{color:var(--amber);}
.kpi.accent-green .value{color:var(--green);}
.kpi.accent-red .value{color:var(--red);}
.kpi.accent-blue .value{color:var(--blue);}
.kpi-bar{height:5px; border-radius:4px; background:var(--surface3); margin-top:12px; overflow:hidden;}
.kpi-bar-fill{height:100%; background:var(--amber); border-radius:4px;}

/* ---- panels / grid ---- */
.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr;}}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.panel-title{font-size:13px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
.panel-title .tag{font-size:10.5px; font-family:var(--mono); color:var(--text-faint); font-weight:400;}

/* ---- bars chart ---- */
.hbar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.hbar-row .lbl{width:150px; flex-shrink:0; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hbar-track{flex:1; height:16px; background:var(--surface3); border-radius:4px; overflow:hidden; position:relative;}
.hbar-fill{height:100%; border-radius:4px; background:var(--amber);}
.hbar-val{width:88px; text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); flex-shrink:0;}

/* ---- donut ---- */
.donut-wrap{display:flex; align-items:center; gap:18px;}
.donut-legend{display:flex; flex-direction:column; gap:8px; font-size:12.5px;}
.legend-item{display:flex; align-items:center; gap:8px;}
.legend-item .sw{width:10px; height:10px; border-radius:3px;}
.legend-item .n{font-family:var(--mono); margin-left:auto; padding-left:14px; color:var(--text-dim);}

/* ---- status badges ---- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.badge .dot{width:6px; height:6px; border-radius:50%;}
.badge-green{background:var(--green-bg); color:#6FE08C;}
.badge-green .dot{background:var(--green);}
.badge-red{background:var(--red-bg); color:#FF8A8E;}
.badge-red .dot{background:var(--red);}
.badge-amber{background:#3A2C0F; color:var(--amber);}
.badge-amber .dot{background:var(--amber);}
.badge-blue{background:var(--blue-bg); color:#8FC1FF;}
.badge-blue .dot{background:var(--blue);}
.badge-gray{background:var(--gray-bg); color:var(--text-dim);}
.badge-gray .dot{background:var(--gray);}

/* ---- tables ---- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left; padding:10px 12px; background:var(--surface2); color:var(--text-faint);
  font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  border-bottom:1px solid var(--border); white-space:nowrap; font-family:var(--mono);
  position:sticky; top:0;
}
tbody td{padding:9px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap;}
tbody tr:hover{background:var(--surface2);}
tbody tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right; font-family:var(--mono);}
td.mono{font-family:var(--mono); font-size:12px;}
.prodname{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-dim); font-size:12px;}
.pos{color:var(--green);}
.neg{color:var(--red);}

.toolbar{display:flex; gap:10px; margin-bottom:12px; align-items:center; flex-wrap:wrap;}
.search{
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  padding:8px 12px; color:var(--text); font-size:12.5px; width:260px; font-family:var(--sans);
}
.search:focus{outline:2px solid var(--amber); outline-offset:1px;}
.btn{
  background:var(--surface3); border:1px solid var(--border); color:var(--text);
  padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
}
.btn:hover{border-color:var(--text-faint);}
.btn-primary{background:var(--amber); border-color:var(--amber); color:#1A1300;}
.btn-primary:hover{filter:brightness(1.08);}
.pillnote{margin-left:auto; font-size:11.5px; color:var(--text-faint); font-family:var(--mono);}

/* ---- expiry / non-moving bucket cards ---- */
.bucket-row{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px;}
@media(max-width:1000px){.bucket-row{grid-template-columns:repeat(2,1fr);}}
.bucket{border-radius:var(--radius); padding:14px; border:1px solid var(--border); background:var(--surface);}
.bucket .n{font-family:var(--mono); font-size:22px; font-weight:700;}
.bucket .lbl{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.bucket .v{font-size:11px; color:var(--text-faint); margin-top:6px; font-family:var(--mono);}
.bucket.urgent{border-color:#5C2020; background:var(--red-bg);}
.bucket.urgent .n{color:var(--red);}
.bucket.warn{border-color:var(--amber-dim); background:#2E2410;}
.bucket.warn .n{color:var(--amber);}
.bucket.watch{border-color:#2E3D5C; background:var(--blue-bg);}
.bucket.watch .n{color:var(--blue);}
.bucket.ok{border-color:#1F4A2A; background:var(--green-bg);}
.bucket.ok .n{color:var(--green);}

/* ---- mobile mockup ---- */
.phone-stage{display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;}
.phone{
  width:340px; background:#000; border-radius:34px; padding:10px; border:1px solid #333;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.phone-screen{
  background:var(--bg); border-radius:26px; overflow:hidden; min-height:640px; display:flex; flex-direction:column;
}
.phone-bar{background:var(--surface); padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
.phone-bar .back{color:var(--text-faint); font-size:16px;}
.phone-bar .t{font-weight:700; font-size:14px;}
.phone-bar .loc{margin-left:auto; font-size:11px; color:var(--amber); font-family:var(--mono); background:#2E2410; padding:3px 8px; border-radius:6px;}
.phone-scan{
  margin:16px; border:2px dashed var(--border); border-radius:14px; padding:22px; text-align:center;
  color:var(--text-faint); font-size:12.5px;
}
.phone-scan .icon{font-size:26px; margin-bottom:8px;}
.phone-search{margin:0 16px 14px 16px;}
.phone-search input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:13px;}
.count-card{margin:0 16px 14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;}
.count-card .code{font-family:var(--mono); font-size:11px; color:var(--amber);}
.count-card .name{font-weight:700; font-size:14.5px; margin-top:4px; line-height:1.35;}
.count-card .meta{display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--text-dim);}
.count-card .meta div span{display:block; color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
.count-card .qty-input{margin-top:14px;}
.count-card .qty-input label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.count-card .qty-row{display:flex; align-items:center; gap:10px; margin-top:6px;}
.qty-btn{width:38px; height:38px; border-radius:9px; background:var(--surface3); border:1px solid var(--border); color:var(--text); font-size:18px; cursor:pointer;}
.qty-field{flex:1; text-align:center; font-family:var(--mono); font-size:22px; font-weight:700; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:8px; color:var(--text);}
.save-btn{margin:16px; background:var(--amber); color:#1A1300; border:none; padding:13px; border-radius:11px; font-weight:700; font-size:14px;}
.no-sysqty-note{margin:0 16px 6px 16px; font-size:10.5px; color:var(--text-faint); display:flex; gap:6px; align-items:center;}
.hidden-lock{font-family:var(--mono); font-size:10px; color:var(--text-faint); background:var(--surface2); padding:2px 6px; border-radius:5px;}

.phone-caption{max-width:280px; padding-top:8px;}
.phone-caption h4{font-size:14px; margin-bottom:8px;}
.phone-caption ul{padding-left:18px; color:var(--text-dim); font-size:12.5px; display:flex; flex-direction:column; gap:6px;}

/* ---- count list ---- */
.round-card{
  display:flex; align-items:center; gap:16px; padding:16px 18px; border:1px solid var(--border);
  border-radius:var(--radius); background:var(--surface); margin-bottom:10px;
}
.round-card .rid{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--amber); width:130px;}
.round-card .meta{display:flex; flex-direction:column; gap:2px;}
.round-card .meta .m1{font-size:13px; font-weight:600;}
.round-card .meta .m2{font-size:11.5px; color:var(--text-faint);}
.round-card .prog{flex:1; max-width:220px;}
.round-card .prog .pt{font-size:11px; color:var(--text-faint); margin-bottom:4px; font-family:var(--mono);}
.round-card .spacer{flex:1;}

.reason-select{background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:5px 8px; border-radius:6px; font-size:11.5px; font-family:var(--sans);}

.footer-note{margin-top:40px; padding:16px 18px; border:1px dashed var(--border); border-radius:var(--radius); font-size:12px; color:var(--text-faint); line-height:1.7;}
.footer-note b{color:var(--text-dim);}

/* ---- v2 additions: identity bar, round selector, toast, audit, loading ---- */
.identity-bar{
  display:flex; align-items:center; gap:10px; padding:8px 28px;
  background:var(--surface2); border-bottom:1px solid var(--border); font-size:12px;
}
.identity-bar input{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:5px 10px; border-radius:6px; font-size:12px; width:160px; font-family:var(--sans);
}
.identity-bar .il{color:var(--text-faint); font-family:var(--mono); font-size:11px;}
.identity-bar .rid-pill{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--amber);
  background:#2E2410; padding:3px 10px; border-radius:20px; display:flex; align-items:center; gap:6px;
}
.identity-bar .rid-pill select{background:transparent; border:none; color:var(--amber); font-family:var(--mono); font-size:11px; cursor:pointer;}

.loading-screen{
  position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:12px; z-index:999;
}
.loading-screen .spin{
  width:28px; height:28px; border-radius:50%; border:3px solid var(--surface3); border-top-color:var(--amber);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen .lt{font-family:var(--mono); font-size:12px; color:var(--text-faint);}

.toast-stack{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:1000;}
.toast{
  background:var(--surface3); border:1px solid var(--border); border-left:3px solid var(--amber);
  padding:10px 16px; border-radius:8px; font-size:12.5px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  animation:toastin .18s ease; max-width:320px;
}
.toast.success{border-left-color:var(--green);}
.toast.error{border-left-color:var(--red);}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13px;}
.empty-state .icon{font-size:28px; margin-bottom:10px; opacity:.5;}

.new-round-form{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:end;
}
.new-round-form .f{display:flex; flex-direction:column; gap:4px;}
.new-round-form label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; font-family:var(--mono);}
.new-round-form input, .new-round-form select{
  background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:12.5px; font-family:var(--sans);
}

.step-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
.btn-danger{background:var(--red-bg); border-color:#5C2020; color:#FF9DA0;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.recount-flag{font-size:10.5px; color:var(--amber); margin-top:4px; display:flex; align-items:center; gap:5px;}
.mini{font-size:11px; color:var(--text-faint);}

.audit-row{display:grid; grid-template-columns:150px 110px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:12px;}
.audit-row .u{color:var(--amber); font-family:var(--mono);}
.audit-row .t{color:var(--text-faint); font-family:var(--mono); font-size:11px;}
.audit-row .d{color:var(--text-dim);}
.audit-row .d b{color:var(--text);}

/* ---- v3: import / export ---- */
.dropzone{
  border:2px dashed var(--border); border-radius:var(--radius); padding:32px; text-align:center;
  background:var(--surface); cursor:pointer; transition:border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag{border-color:var(--amber); background:var(--surface2);}
.dropzone .icon{font-size:28px; margin-bottom:8px; color:var(--text-faint);}
.dropzone .main{font-size:13.5px; font-weight:600;}
.dropzone .sub{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.dropzone input{display:none;}

.col-check-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:6px; margin-top:10px;}
.col-check{display:flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 8px; border-radius:6px; background:var(--surface2); font-family:var(--mono);}
.col-check.ok{color:var(--green);}
.col-check.missing{color:var(--red); background:var(--red-bg);}
.col-check .m{margin-left:auto; font-size:9.5px; color:var(--text-faint);}

.import-summary{display:flex; gap:20px; flex-wrap:wrap; margin:14px 0;}
.import-summary .stat{display:flex; flex-direction:column; gap:2px;}
.import-summary .stat .n{font-family:var(--mono); font-size:20px; font-weight:700;}
.import-summary .stat .l{font-size:11px; color:var(--text-faint);}

.mode-choice{display:flex; gap:10px; margin:14px 0;}
.mode-card{
  flex:1; border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer;
  background:var(--surface); transition:border-color .12s;
}
.mode-card.selected{border-color:var(--amber); background:#2E2410;}
.mode-card .mt{font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px;}
.mode-card .md{font-size:11.5px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
.mode-card input{margin-right:2px;}

.confirm-box{
  border:1px solid var(--amber-dim); background:#2E2410; border-radius:var(--radius); padding:16px; margin-top:14px;
}
.confirm-box .ct{font-weight:700; color:var(--amber); font-size:13px; margin-bottom:6px;}

const nowStr = () => {

let currentUser = 'พนักงาน';

let state = {tab:'dashboard', location:'', category:'', status:''};

// ---------------- Firestore storage helpers ----------------
// Firestore doc size limit is 1 MiB — our biggest payloads (~270KB) are safely within that.
// Every key is stored as one document in the "kv" collection: { value: <JSON string>, updatedAt }
let db = null;
let firestoreReady = false;
function initFirestore(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firestoreReady = true;
  }catch(e){
    console.error('Firebase init failed', e);
    firestoreReady = false;
  }
}
async function sGet(key, shared){
  try{
    const snap = await db.collection('kv').doc(key).get();
    if(!snap.exists) return null;
    const v = snap.data().value;
    return v ? JSON.parse(v) : null;
  }catch(e){
    console.error('sGet failed', key, e);
    toast('โหลดข้อมูลไม่สำเร็จ (' + key + '): ' + (e.code||e.message), 'error');
    return null;
  }
}
async function sSet(key, value, shared){
  try{
    await db.collection('kv').doc(key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
    return true;
  }catch(e){
    console.error('sSet failed', key, e);
    toast('บันทึกไม่สำเร็จ (' + key + '): ' + (e.code||e.message), 'error');
    return false;
  }
}

function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const t = document.createElement('div');
  t.className = 'toast' + (type?' '+type:'');
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

async function logAudit(action, oldValue, newValue){
  AUDIT.unshift({logId: Math.random().toString(36).slice(2,8), user: currentUser, datetime: nowStr(), action, oldValue: oldValue==null?'-':String(oldValue), newValue: newValue==null?'-':String(newValue)});
  if(AUDIT.length>400) AUDIT = AUDIT.slice(0,400);
  await sSet('audit_log', AUDIT, true);
}

// ---------------- init ----------------
async function init(){
  initFirestore();
  if(!firestoreReady){
    document.getElementById('loadingScreen').innerHTML = '<div class="lt" style="color:var(--red); max-width:320px; text-align:center;">เชื่อมต่อ Firebase ไม่สำเร็จ — ตรวจสอบ firebaseConfig และการตั้งค่า Firestore ใน Firebase Console แล้วรีโหลดหน้านี้</div>';
    return;
  }
  BASE = await sGet('seed_v1', true);
  if(!BASE){
    BASE = SEED.map(i=>({...i}));
    await sSet('seed_v1', BASE, true);
  }
  ROUNDS = await sGet('rounds', true) || [];
  AUDIT = await sGet('audit_log', true) || [];

  const savedName = sessionStorageSafeGet();
  if(savedName) currentUser = savedName;

  if(ROUNDS.length===0){
    await createRound(true); // auto-create current month's round so app isn't empty
  }
  ACTIVE_ROUND = ROUNDS.find(r=>r.status!=='closed')?.id || ROUNDS[0]?.id;

  populateFilters();
  renderIdentityBar();
  document.getElementById('loadingScreen').style.display='none';
  render();
}
// sessionStorage is fine for pure UI convenience (not "memory"), but the environment forbids
// browser storage in artifacts entirely — so instead we simply keep name in-memory per session.
function sessionStorageSafeGet(){ return null; }

// ---------------- round management ----------------
function monthNameTH(m){
  return ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][m];
}
async function createRound(silent, opts){
  const d = new Date();
  const month = opts?.month || (d.getMonth()+1);
  const year = opts?.year || (d.getFullYear()+543);
  const location = opts?.location || 'ทุกคลัง';
  const id = `COUNT-${year}${String(month).padStart(2,'0')}-${Math.random().toString(36).slice(2,5).toUpperCase()}`;
  const detail = BASE.filter(i=> !location || location==='ทุกคลัง' || i.loc===location).map((i,idx)=>({
    id: idx, code:i.c, name:i.n, cat:i.cat, unit:i.u, loc:i.loc, exp:i.exp, et:i.et, dte:i.dte,
    systemQty:i.qty, unitCost:i.uc, stockValue:i.sv,
    countQty1:null, countQty2:null, finalQty:null, diff:null,
    status:'uncounted', reason:'', countedBy:null, countedAt:null
  }));
  const meta = {id, month, monthLabel:monthNameTH(month), year, location, status:'counting', owner:currentUser, createdBy:currentUser, createdDate:nowStr(), itemsCount:detail.length};
  ROUNDS.unshift(meta);
  DETAIL_CACHE[id] = detail;
  await sSet('rounds', ROUNDS, true);
  await sSet('round_detail:'+id, detail, true);
  await logAudit('สร้างรอบนับ', '-', id);
  if(!silent) toast('สร้างรอบนับ '+id+' สำเร็จ', 'success');
  ACTIVE_ROUND = id;
  return id;
}

async function loadDetail(roundId){
  if(DETAIL_CACHE[roundId]) return DETAIL_CACHE[roundId];
  const d = await sGet('round_detail:'+roundId, true) || [];
  DETAIL_CACHE[roundId] = d;
  return d;
}
async function saveDetail(roundId){
  await sSet('round_detail:'+roundId, DETAIL_CACHE[roundId], true);
}
async function saveRounds(){ await sSet('rounds', ROUNDS, true); }

async function setRoundStatus(roundId, status){
  const r = ROUNDS.find(x=>x.id===roundId);
  const old = r.status; r.status = status;
  await saveRounds();
  await logAudit(`เปลี่ยนสถานะรอบ ${roundId}`, old, status);
}

// ---------------- count entry ----------------
async function submitCount(roundId, itemId, qty){
  const detail = await loadDetail(roundId);
  const item = detail.find(x=>x.id===itemId);
  if(!item) return;
  const isRecount = item.countQty1 !== null;
  const oldVal = item.finalQty;
  if(!isRecount){
    item.countQty1 = qty;
    item.finalQty = qty;
  } else {
    item.countQty2 = qty;
    item.finalQty = qty; // recount overrides as the authoritative figure
  }
  item.diff = item.finalQty - item.systemQty;
  item.status = item.diff===0 ? 'matched' : 'mismatch';
  item.countedBy = currentUser;
  item.countedAt = nowStr();
  await saveDetail(roundId);
  await logAudit(`นับ ${item.code} (${item.loc})`, oldVal, item.finalQty);
  return item;
}

async function setReason(roundId, itemId, reason){
  const detail = await loadDetail(roundId);
  const item = detail.find(x=>x.id===itemId);
  if(!item) return;
  const old = item.reason;
  item.reason = reason;
  await saveDetail(roundId);
  await logAudit(`ระบุเหตุผลผลต่าง ${item.code}`, old||'-', reason);
}

async function approveRound(roundId){
  const detail = await loadDetail(roundId);
  const unresolved = detail.filter(i=>i.status==='mismatch' && !i.reason);
  if(unresolved.length>0){
    toast(`ยังมี ${unresolved.length} รายการที่ไม่ตรง ยังไม่ได้ระบุเหตุผล`, 'error');
    return false;
  }
  await setRoundStatus(roundId, 'approved');
  await logAudit(`อนุมัติ & สร้าง ADJUST`, ROUNDS.find(r=>r.id===roundId)?.status, 'approved');
  toast('อนุมัติรอบนับสำเร็จ — สร้างรายการ ADJUST แล้ว', 'success');
  return true;
}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function renderIdentityBar(){
  const bar = document.getElementById('identityBar');
  bar.innerHTML = '';
  bar.appendChild(el('span','il','ผู้ใช้งาน:'));
  const inp = document.createElement('input');
  inp.value = currentUser;
  inp.onchange = ()=>{ currentUser = inp.value.trim() || 'พนักงาน'; toast('เปลี่ยนชื่อผู้ใช้งานเป็น '+currentUser); };
  bar.appendChild(inp);
  const pill = el('div','rid-pill');
  pill.appendChild(el('span','','รอบที่ทำงานอยู่:'));
  const sel = document.createElement('select');
  ROUNDS.forEach(r=>{ const o=document.createElement('option'); o.value=r.id; o.textContent=`${r.id} (${statusLabel(r.status)})`; sel.appendChild(o); });

  sel.onchange = ()=>{ ACTIVE_ROUND = sel.value; render(); };

function statusLabel(s){ return {draft:'Draft', counting:'Counting', review:'Waiting for Review', approved:'Approved', closed:'Closed'}[s]||s; }
function statusBadgeKind(s){ return {draft:'gray', counting:'blue', review:'amber', approved:'green', closed:'gray'}[s]||'gray'; }

function populateFilters(){
  const locs = [...new Set(BASE.map(i=>i.loc))].sort();
  const cats = [...new Set(BASE.map(i=>i.cat).filter(Boolean))].sort();
  const fl = document.getElementById('fLocation'); fl.innerHTML='<option value="">ทั้งหมด</option>';
  locs.forEach(l=>{ const o=document.createElement('option'); o.value=l; o.textContent=l; fl.appendChild(o); });
  const fc = document.getElementById('fCategory'); fc.innerHTML='<option value="">ทั้งหมด</option>';
  cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; fc.appendChild(o); });
  fl.onchange = ()=>{ state.location=fl.value; render(); };
  fc.onchange = ()=>{ state.category=fc.value; render(); };
  document.getElementById('fStatus').onchange = (e)=>{ state.status=e.target.value; render(); };
}

function filterBase(items){
  return items.filter(i=>{
    if(state.location && i.loc!==state.location) return false;
    if(state.category && i.cat!==state.category) return false;
    return true;
  });
}
function filterDetail(items){
  return items.filter(i=>{
    if(state.location && i.loc!==state.location) return false;
    if(state.category && i.cat!==state.category) return false;
    if(state.status==='counted' && i.status==='uncounted') return false;
    if(state.status==='uncounted' && i.status!=='uncounted') return false;
    if(state.status==='mismatch' && i.status!=='mismatch') return false;
    return true;
  });
}

// ---------------- shared small UI builders ----------------
function kpiCard(label, value, unit, accent, extra){
  const c = el('div','kpi'+(accent?' accent-'+accent:''));
  c.appendChild(el('div','label',label));
  c.appendChild(el('div','value', value + (unit?`<span class="unit">${unit}</span>`:'')));
  if(extra) c.appendChild(extra);
  return c;
}
function progressBar(p){ const w=el('div','kpi-bar'); const f=el('div','kpi-bar-fill'); f.style.width=Math.min(100,p)+'%'; w.appendChild(f); return w; }
function statusBadge(kind){
  const map = {match:['badge-green','ตรง'],matched:['badge-green','ตรง'], mismatch:['badge-red','ไม่ตรง'], pending:['badge-amber','รอตรวจสอบ'], counted:['badge-blue','นับแล้ว'], uncounted:['badge-gray','ยังไม่ได้นับ']};
  const [cls,label]=map[kind]||['badge-gray',kind];
  return el('span','badge '+cls, `<span class="dot"></span>${label}`);
}
function donutPanel(title, segs){
  const p = el('div','panel'); p.appendChild(el('div','panel-title',title));
  const total = segs.reduce((a,s)=>a+s.value,0) || 1;
  let acc=0; const stops = segs.map(s=>{const a=acc/total*100; acc+=s.value; const b=acc/total*100; return `${s.color} ${a}% ${b}%`;}).join(',');
  const wrap = el('div','donut-wrap');
  const ring = el('div',''); ring.style.cssText=`width:104px;height:104px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;position:relative;`;
  const hole = el('div',''); hole.style.cssText=`position:absolute;inset:14px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:15px;`;
  hole.textContent = pct(segs[0].value/total*100); ring.appendChild(hole); wrap.appendChild(ring);
  const legend = el('div','donut-legend');
  segs.forEach(s=>{ const li=el('div','legend-item'); li.innerHTML=`<span class="sw" style="background:${s.color}"></span>${s.label}<span class="n">${num(s.value)}</span>`; legend.appendChild(li); });
  wrap.appendChild(legend); p.appendChild(wrap); return p;
}
function barPanel(title, dataObj, color){
  const p = el('div','panel'); p.appendChild(el('div','panel-title',title));
  const rows = Object.entries(dataObj).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(1,...rows.map(r=>r[1]));
  rows.forEach(([k,v])=>{
    const row = el('div','hbar-row'); row.appendChild(el('div','lbl',k));
    const track = el('div','hbar-track'); const fill=el('div','hbar-fill'); fill.style.width=(v/max*100)+'%'; fill.style.background=color;
    track.appendChild(fill); row.appendChild(track); row.appendChild(el('div','hbar-val',money(v))); p.appendChild(row);
  });
  return p;
}

async function renderDashboard(container){
  if(!ACTIVE_ROUND){ container.appendChild(emptyState('ยังไม่มีรอบนับ','ไปที่แท็บ "รอบการนับ" เพื่อสร้างรอบใหม่')); return; }
  const round = ROUNDS.find(r=>r.id===ACTIVE_ROUND);
  const detail = filterDetail(await loadDetail(ACTIVE_ROUND));
  const total = detail.length;
  const counted = detail.filter(i=>i.status!=='uncounted');
  const uncounted = detail.filter(i=>i.status==='uncounted');
  const matched = detail.filter(i=>i.status==='matched');
  const mismatched = detail.filter(i=>i.status==='mismatch');
  const pctCounted = total? counted.length/total*100 : 0;
  const pctAccuracy = counted.length? matched.length/counted.length*100 : 0;

  container.appendChild(el('div','section-title',`รอบ ${round.id} · ${round.monthLabel} ${round.year} <span style="margin-left:8px;"></span><div class="line"></div>`));
  container.querySelector('.section-title span').appendChild(statusBadge2(round.status));

  const grid = el('div','kpi-grid');
  grid.appendChild(kpiCard('จำนวนรายการทั้งหมด', num(total)));
  grid.appendChild(kpiCard('นับแล้ว', num(counted.length),'','blue'));
  grid.appendChild(kpiCard('ยังไม่ได้นับ', num(uncounted.length)));
  const pcard = kpiCard('% การนับ', pct(pctCounted),'','amber'); pcard.appendChild(progressBar(pctCounted)); grid.appendChild(pcard);
  grid.appendChild(kpiCard('รายการตรง', num(matched.length),'','green'));
  grid.appendChild(kpiCard('รายการไม่ตรง', num(mismatched.length),'','red'));
  const acard = kpiCard('% ความถูกต้องของสต็อก', pct(pctAccuracy)); acard.appendChild(progressBar(pctAccuracy)); grid.appendChild(acard);
  container.appendChild(grid);

  container.appendChild(el('div','section-title','กราฟสรุป<div class="line"></div>'));
  const g2 = el('div','grid3');
  g2.appendChild(donutPanel('Stock Count Progress', [{label:'นับแล้ว',value:counted.length,color:'var(--blue)'},{label:'ยังไม่ได้นับ',value:uncounted.length,color:'var(--gray)'}]));
  g2.appendChild(donutPanel('Count Accuracy', [{label:'ตรง',value:matched.length,color:'var(--green)'},{label:'ไม่ตรง',value:mismatched.length,color:'var(--red)'}]));
  const locPanel = el('div','panel'); locPanel.appendChild(el('div','panel-title','Location ที่มีปัญหามากที่สุด <span class="tag">ตามมูลค่าไม่ตรง</span>'));
  const byLoc = {}; mismatched.forEach(i=>{ byLoc[i.loc]=(byLoc[i.loc]||0)+Math.abs(i.diff*i.unitCost); });
  const locRows = Object.entries(byLoc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(locRows.length===0){ locPanel.appendChild(el('div','mini','ไม่มีรายการผลต่างในตัวกรองนี้')); }
  const maxLoc = Math.max(1,...locRows.map(r=>r[1]));
  locRows.forEach(([loc,val])=>{
    const row = el('div','hbar-row'); row.appendChild(el('div','lbl',loc));
    const track = el('div','hbar-track'); const fill=el('div','hbar-fill'); fill.style.cssText=`width:${val/maxLoc*100}%; background:var(--red);`; track.appendChild(fill);
    row.appendChild(track); row.appendChild(el('div','hbar-val',money(val))); locPanel.appendChild(row);
  });
  g2.appendChild(locPanel);
  container.appendChild(g2);

  container.appendChild(el('div','section-title','Top 10 Variance (ตามมูลค่า)<div class="line"></div>'));
  const top10 = mismatched.slice().sort((a,b)=>Math.abs(b.diff*b.unitCost)-Math.abs(a.diff*a.unitCost)).slice(0,10);
  container.appendChild(varianceTable(top10));
}
function statusBadge2(s){ const b=el('span','badge badge-'+statusBadgeKind(s), `<span class="dot"></span>${statusLabel(s)}`); return b; }
function emptyState(title, sub){ const e=el('div','empty-state'); e.innerHTML=`<div class="icon">▤</div><div style="font-weight:600; color:var(--text-dim);">${title}</div><div style="margin-top:4px;">${sub}</div>`; return e; }

function varianceTable(rows){
  const wrap = el('div','table-wrap');
  const t = el('table');
  t.innerHTML = `<thead><tr><th>Product</th><th>ชื่อสินค้า</th><th>LOT</th><th>Location</th><th class="num">System Qty</th><th class="num">Count Qty</th><th class="num">Diff</th><th class="num">มูลค่าผลต่าง</th><th>สถานะ</th><th>เหตุผล</th></tr></thead>`;
  const tb = el('tbody');
  rows.forEach(i=>{
    const diffClass = i.diff>0?'pos':(i.diff<0?'neg':'');
    const tr = el('tr');
    tr.innerHTML = `<td class="mono">${i.code}</td><td class="prodname" title="${i.name}">${i.name}</td><td class="mono">${i.exp||'-'}</td><td>${i.loc}</td>
      <td class="num mono">${num(i.systemQty)}</td><td class="num mono">${i.finalQty==null?'-':num(i.finalQty)}</td>
      <td class="num mono ${diffClass}">${i.diff==null?'-':(i.diff>0?'+':'')+num(i.diff)}</td>
      <td class="num mono ${diffClass}">${i.diff==null?'-':money(i.diff*i.unitCost)}</td><td></td><td class="mini">${i.reason||'—'}</td>`;
    tr.children[8].appendChild(statusBadge(i.status));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}

function renderValue(container){
  const items = filterBase(BASE);
  const total = items.reduce((a,i)=>a+i.sv,0);
  container.appendChild(el('div','section-title','สรุปมูลค่าสต็อก (ยอด Stock Balance ปัจจุบัน)<div class="line"></div>'));
  const grid = el('div','kpi-grid');
  grid.appendChild(kpiCard('มูลค่าสต็อกทั้งหมด', money(total)));
  grid.appendChild(kpiCard('จำนวนรายการ (SKU×LOT×Location)', num(items.length)));
  grid.appendChild(kpiCard('จำนวน SKU', num(new Set(items.map(i=>i.c)).size)));
  grid.appendChild(kpiCard('จำนวน Location', num(new Set(items.map(i=>i.loc)).size)));
  container.appendChild(grid);

  container.appendChild(el('div','section-title','แยกตามหมวดหมู่ & คลัง<div class="line"></div>'));
  const g2 = el('div','grid2');
  const byCat={}; items.forEach(i=>{ byCat[i.cat||'ไม่ระบุ']=(byCat[i.cat||'ไม่ระบุ']||0)+i.sv; });
  g2.appendChild(barPanel('Stock Value by Category', byCat, 'var(--amber)'));
  const byLoc={}; items.forEach(i=>{ byLoc[i.loc]=(byLoc[i.loc]||0)+i.sv; });
  g2.appendChild(barPanel('Stock Value by Location', byLoc, 'var(--blue)'));
  container.appendChild(g2);

  if(ACTIVE_ROUND){
    container.appendChild(el('div','section-title',`มูลค่าตามความคืบหน้าการนับ — รอบ ${ACTIVE_ROUND}<div class="line"></div>`));
    loadDetail(ACTIVE_ROUND).then(detail=>{
      detail = filterDetail(detail);
      const counted = detail.filter(i=>i.status!=='uncounted');
      const uncounted = detail.filter(i=>i.status==='uncounted');
      const mismatched = detail.filter(i=>i.status==='mismatch');
      const short = mismatched.filter(i=>i.diff<0), over = mismatched.filter(i=>i.diff>0);
      const valShort = short.reduce((a,i)=>a+i.diff*i.unitCost,0);
      const valOver = over.reduce((a,i)=>a+i.diff*i.unitCost,0);
      const grid2 = el('div','kpi-grid');
      grid2.appendChild(kpiCard('มูลค่าที่นับแล้ว', money(counted.reduce((a,i)=>a+i.stockValue,0)),'','blue'));
      grid2.appendChild(kpiCard('มูลค่าที่ยังไม่ได้นับ', money(uncounted.reduce((a,i)=>a+i.stockValue,0))));
      grid2.appendChild(kpiCard('มูลค่าขาด', money(Math.abs(valShort)),'','red'));
      grid2.appendChild(kpiCard('มูลค่าเกิน', money(valOver),'','green'));
      grid2.appendChild(kpiCard('Net Variance', (valShort+valOver>=0?'+':'')+money(valShort+valOver),'', (valShort+valOver)<0?'red':'green'));
      const holder = document.getElementById('value-round-holder');
      if(holder){ holder.innerHTML=''; holder.appendChild(grid2); }
    });
    const holder = el('div',''); holder.id='value-round-holder'; holder.innerHTML='<div class="mini">กำลังโหลด...</div>';
    container.appendChild(holder);
  }
}

// IMPORT / EXPORT — shared parse & file helpers
// ============================================================
const EXPECTED_COLUMNS = ['ProductKey','Location','Lot','Lot_Balance','Price/Unit','Unit','Product type','Active','MFG Date','Date','Type','RefID','LogID','Residual value','TotalStock','แจ้งเตือนวันหมดอายุ'];
const REQUIRED_COLUMNS = ['ProductKey','Location','Lot','Lot_Balance','Price/Unit','Unit','Product type'];

function parseThaiDateJS(s){
  if(!s || typeof s!=='string' || !s.trim()) return null;
  const parts = s.trim().split('/');
  if(parts.length!==3) return null;
  const [d,m,yRaw] = parts.map(x=>parseInt(x,10));
  if(!d||!m||!yRaw) return null;
  const y = yRaw>2200 ? yRaw-543 : yRaw; // Buddhist -> Gregorian
  const dt = new Date(y, m-1, d);
  if(isNaN(dt.getTime())) return null;
  return dt;
}
function isoDate(dt){ if(!dt) return null; const p=x=>String(x).padStart(2,'0'); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function parseNumJS(s){ if(s==null||s==='') return 0; const n = parseFloat(String(s).replace(/[$,]/g,'')); return isNaN(n)?0:n; }
function parseProductKeyJS(s){
  if(!s) return {code:'', name:''};
  const m = /^\*?([A-Za-z0-9-]+)\s*\|\s*(.*)$/.exec(s.trim());
  if(m) return {code:m[1].trim(), name:m[2].trim()};
  return {code:s.trim(), name:''};
}

function csvToRows(text){
  if(window.Papa){
    const res = Papa.parse(text, {header:true, skipEmptyLines:true});
    return res.data;
  }
  // minimal fallback parser (no quoted-comma support)
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',');
    const o = {};
    headers.forEach((h,i)=>o[h]=cells[i]!==undefined?cells[i].trim():'');
    return o;
  });
}

function excelToRows(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}

function rowsToItems(rows){
  const today = new Date();
  const items = [];
  const anomalies = [];
  rows.forEach((r,idx)=>{
    const pk = parseProductKeyJS(r['ProductKey']);
    if(!pk.code){ anomalies.push(`แถว ${idx+2}: ไม่มี ProductKey`); return; }
    const qty = parseNumJS(r['Lot_Balance']);
    if(r['Lot_Balance']!==undefined && isNaN(parseFloat(String(r['Lot_Balance']).replace(/[$,]/g,'')))){ anomalies.push(`แถว ${idx+2}: Lot_Balance ไม่ใช่ตัวเลข (${r['Lot_Balance']})`); }
    const uc = parseNumJS(r['Price/Unit']);
    const expDt = parseThaiDateJS(r['Lot']);
    const lmDt = parseThaiDateJS(r['Date']);
    const cat = (r['Product type']||'').trim();
    const et = cat === 'วัตถุดิบ' && !!expDt;
    const dte = et && expDt ? Math.round((expDt - today)/86400000) : null;
    const dsm = lmDt ? Math.round((today - lmDt)/86400000) : null;
    const sv = r['Residual value']!==undefined && r['Residual value']!=='' ? parseNumJS(r['Residual value']) : qty*uc;
    items.push({
      c: pk.code, n: pk.name, cat: cat, u: (r['Unit']||'').trim(), loc: (r['Location']||'').trim(),
      exp: et ? isoDate(expDt) : null, et, dte,
      qty, uc, sv,
      lmd: lmDt ? isoDate(lmDt) : null, lmt: (r['Type']||'').trim(), dsm,
    });
  });
  return {items, anomalies};
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(filename, headers, rows){
  const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))];
  downloadBlob(filename, '\uFEFF'+lines.join('\r\n'), 'text/csv;charset=utf-8;');
}
function exportXLSX(filename, headers, rows, sheetName){
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName||'Report');
  XLSX.writeFile(wb, filename);
}
function exportPrintPDF(title, headers, rows){
  const w = window.open('', '_blank');
  const style = `
    <style>
      body{font-family:'Noto Sans Thai', sans-serif; padding:24px; color:#111;}

      .meta{font-size:11px; color:#666; margin-bottom:16px;}

  const tbody = rows.map(r=>'<tr>'+r.map(c=>`<td>${c==null?'':c}</td>`).join('')+'</tr>').join('');
  w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">

    <script>window.onload=()=>{setTimeout(()=>window.print(),300);}${'</scr'+'ipt>'}

function handleImportFile(file){
  importState = {rows:null, headers:[], items:null, anomalies:[], mode:'merge', filename:file.name};
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      let rows;
      if(ext==='csv'){ rows = csvToRows(e.target.result); }
      else { rows = excelToRows(e.target.result); }
      if(!rows || rows.length===0){ toast('ไม่พบข้อมูลในไฟล์ หรือไฟล์ว่างเปล่า','error'); return; }
      importState.rows = rows;
      importState.headers = Object.keys(rows[0]);
      const {items, anomalies} = rowsToItems(rows);
      importState.items = items;
      importState.anomalies = anomalies;
      renderImportPreview();
    }catch(err){
      toast('อ่านไฟล์ไม่สำเร็จ: '+err.message,'error');
    }
  };
  if(ext==='csv') reader.readAsText(file, 'utf-8'); else reader.readAsArrayBuffer(file);
}

function renderImportPreview(){
  const holder = document.getElementById('importPreviewHolder');
  if(!holder) return;
  holder.innerHTML = '';
  holder.appendChild(el('div','section-title','2 · ตรวจสอบคอลัมน์<div class="line"></div>'));
  const colGrid = el('div','col-check-grid');
  EXPECTED_COLUMNS.forEach(c=>{
    const has = importState.headers.includes(c);
    const required = REQUIRED_COLUMNS.includes(c);
    const chip = el('div','col-check '+(has?'ok':(required?'missing':'')));
    chip.innerHTML = `${has?'✓':'✕'} ${c} ${required?'<span class="m">required</span>':'<span class="m">optional</span>'}`;
    colGrid.appendChild(chip);
  });
  holder.appendChild(colGrid);
  const missingRequired = REQUIRED_COLUMNS.filter(c=>!importState.headers.includes(c));

  holder.appendChild(el('div','section-title','3 · Preview ข้อมูล<div class="line"></div>'));
  const summary = el('div','import-summary');
  summary.innerHTML = `
    <div class="stat"><div class="n">${importState.rows.length}</div><div class="l">แถวทั้งหมด</div></div>
    <div class="stat"><div class="n" style="color:${importState.anomalies.length?'var(--red)':'var(--green)'}">${importState.anomalies.length}</div><div class="l">รายการผิดปกติ</div></div>
    <div class="stat"><div class="n">${new Set(importState.items.map(i=>i.c)).size}</div><div class="l">SKU ไม่ซ้ำ</div></div>
    <div class="stat"><div class="n">${new Set(importState.items.map(i=>i.loc)).size}</div><div class="l">Location</div></div>
  `;
  holder.appendChild(summary);

  if(importState.anomalies.length>0){
    const al = el('div','anomaly-list');
    importState.anomalies.slice(0,10).forEach(a=> al.appendChild(el('div','',a)));
    if(importState.anomalies.length>10) al.appendChild(el('div','',`...และอีก ${importState.anomalies.length-10} รายการ`));
    holder.appendChild(al);
  }

  const wrap = el('div','table-wrap');
  const t = el('table');
  t.innerHTML = '<thead><tr>'+importState.headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead>';
  const tb = el('tbody');
  importState.rows.slice(0,15).forEach(r=>{
    const tr = el('tr');
    tr.innerHTML = importState.headers.map(h=>`<td class="mono">${r[h]??''}</td>`).join('');
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t);
  holder.appendChild(wrap);
  holder.appendChild(el('div','footer-note',`แสดง 15 จาก ${importState.rows.length} แถว`));

  if(missingRequired.length>0){
    holder.appendChild(el('div','confirm-box',`<div class="ct">⚠️ ยังนำเข้าไม่ได้</div><div class="cd">ไฟล์นี้ขาดคอลัมน์ที่จำเป็น: ${missingRequired.join(', ')} — กรุณาแก้ไขไฟล์แล้วอัปโหลดใหม่</div>`));
    return;
  }

  holder.appendChild(el('div','section-title','4 · เลือกวิธีนำเข้า<div class="line"></div>'));
  const modeChoice = el('div','mode-choice');
  modeChoice.innerHTML = `
    <label class="mode-card selected" id="modeMerge">
      <div class="mt"><input type="radio" name="importMode" checked> เพิ่ม/อัปเดต (Merge)</div>
      <div class="md">อัปเดตเฉพาะ Product+LOT+Location ที่มีในไฟล์ใหม่ ส่วนที่เหลือคงเดิม — ปลอดภัยกว่า</div>
    </label>
    <label class="mode-card" id="modeReplace">
      <div class="mt"><input type="radio" name="importMode"> แทนที่ทั้งหมด (Replace)</div>
      <div class="md">ลบ Stock Balance เดิมทั้งหมด แล้วใช้ข้อมูลจากไฟล์นี้แทน — ใช้เมื่อ export ยอดใหม่ทั้งคลัง</div>
    </label>
  `;
  holder.appendChild(modeChoice);
  const btnStart = el('button','btn btn-primary','นำเข้าข้อมูล');
  btnStart.style.marginTop='14px';
  holder.appendChild(btnStart);

  setTimeout(()=>{
    document.getElementById('modeMerge').onclick = ()=>{ importState.mode='merge'; document.getElementById('modeMerge').classList.add('selected'); document.getElementById('modeReplace').classList.remove('selected'); document.getElementById('modeMerge').querySelector('input').checked=true; };
    document.getElementById('modeReplace').onclick = ()=>{ importState.mode='replace'; document.getElementById('modeReplace').classList.add('selected'); document.getElementById('modeMerge').classList.remove('selected'); document.getElementById('modeReplace').querySelector('input').checked=true; };
    btnStart.onclick = ()=> renderImportConfirm(holder);
  },0);
}

function renderImportConfirm(holder){
  let box = document.getElementById('importConfirmBox');
  if(box) box.remove();
  box = el('div','confirm-box'); box.id='importConfirmBox';
  const willReplace = importState.mode==='replace';
  box.innerHTML = `<div class="ct">ยืนยันการนำเข้า</div>
    <div class="cd">${willReplace
      ? `จะ<b>ลบ Stock Balance เดิมทั้งหมด (${BASE.length} รายการ)</b> แล้วแทนที่ด้วยข้อมูลใหม่ ${importState.items.length} รายการจากไฟล์ "${importState.filename}"`
      : `จะอัปเดต/เพิ่มรายการ Product+LOT+Location จำนวน ${importState.items.length} รายการจากไฟล์ "${importState.filename}" เข้ากับ Stock Balance เดิม (${BASE.length} รายการ) — รายการที่ไม่อยู่ในไฟล์ใหม่จะไม่ถูกแตะต้อง`}
    </div>`;
  const btn = el('button','btn btn-danger','ยืนยันนำเข้า');
  btn.style.marginTop='10px';
  btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent='กำลังนำเข้า...';
    await doImport();
  };
  box.appendChild(btn);
  holder.appendChild(box);
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

async function doImport(){
  const before = BASE.length;
  let added=0, updated=0;
  if(importState.mode==='replace'){
    BASE = importState.items.map((i,idx)=>({...i}));
    added = BASE.length;
  } else {
    const key = i => i.c+'|'+i.exp+'|'+i.loc;
    const map = new Map(BASE.map(i=>[key(i), i]));
    importState.items.forEach(ni=>{
      const k = key(ni);
      if(map.has(k)) updated++; else added++;
      map.set(k, ni);
    });
    BASE = Array.from(map.values());
  }
  await sSet('seed_v1', BASE, true);
  await logAudit('นำเข้าข้อมูล ('+importState.mode+')', before+' รายการ', BASE.length+' รายการ ('+importState.filename+')');
  toast(`นำเข้าสำเร็จ — เพิ่มใหม่ ${added} รายการ, อัปเดต ${updated} รายการ`, 'success');
  populateFilters();
  importState = {rows:null, headers:[], items:null, anomalies:[], mode:'merge', filename:''};
  render();
}

// TAB: EXPORT — REAL
// ============================================================
function reportStockCount(){
  const detail = ACTIVE_ROUND ? (DETAIL_CACHE[ACTIVE_ROUND]||[]) : [];
  const headers = ['Product Code','ชื่อสินค้า','LOT','Location','System Qty','Count Qty','Final Qty','Diff','สถานะ','นับโดย','เวลา'];
  const rows = filterDetail(detail).map(i=>[i.code,i.name,i.exp||'-',i.loc,i.systemQty,i.countQty1??'-',i.finalQty??'-',i.diff??'-',statusLabelTH(i.status),i.countedBy||'-',i.countedAt||'-']);
  return {headers, rows, title:`Stock Count Report — ${ACTIVE_ROUND||''}`};
}
function reportVariance(){
  const detail = ACTIVE_ROUND ? (DETAIL_CACHE[ACTIVE_ROUND]||[]) : [];
  const mismatched = filterDetail(detail).filter(i=>i.status==='mismatch');
  const headers = ['Product Code','ชื่อสินค้า','LOT','Location','System Qty','Final Qty','Diff','มูลค่าผลต่าง','เหตุผล'];
  const rows = mismatched.map(i=>[i.code,i.name,i.exp||'-',i.loc,i.systemQty,i.finalQty,i.diff,Math.round(i.diff*i.unitCost),i.reason||'-']);
  return {headers, rows, title:`Variance Report — ${ACTIVE_ROUND||''}`};
}
function reportExpiry(){
  const items = filterBase(BASE).filter(i=>i.et && i.dte!=null).sort((a,b)=>a.dte-b.dte);
  const headers = ['Product Code','ชื่อสินค้า','LOT/วันหมดอายุ','เหลือ (วัน)','Location','จำนวน','หน่วย','มูลค่า'];
  const rows = items.map(i=>[i.c,i.n,i.exp,i.dte,i.loc,i.qty,i.u,Math.round(i.sv)]);
  return {headers, rows, title:'Expiry Report'};
}
function reportNonMoving(){
  const items = filterBase(BASE).filter(i=>i.dsm>30).sort((a,b)=>b.sv-a.sv);
  const headers = ['Product Code','ชื่อสินค้า','LOT','Location','Stock Qty','หน่วย','Unit Cost','Stock Value','Last Movement','วันที่ผ่านมา'];
  const rows = items.map(i=>[i.c,i.n,i.exp||'-',i.loc,i.qty,i.u,i.uc,Math.round(i.sv),i.lmd||'-',i.dsm]);
  return {headers, rows, title:'Non-Moving Stock Report'};
}
function reportValuation(){
  const items = filterBase(BASE).sort((a,b)=>b.sv-a.sv);
  const headers = ['Product Code','ชื่อสินค้า','Category','LOT','Location','Qty','หน่วย','Unit Cost','Stock Value'];
  const rows = items.map(i=>[i.c,i.n,i.cat,i.exp||'-',i.loc,i.qty,i.u,i.uc,Math.round(i.sv)]);
  return {headers, rows, title:'Stock Valuation Report'};
}
function statusLabelTH(s){ return {matched:'ตรง', mismatch:'ไม่ตรง', uncounted:'ยังไม่ได้นับ'}[s]||s; }

const REPORTS = [
  {id:'count', name:'Stock Count Report', desc:'สถานะการนับรายรายการของรอบที่เลือก', fn:reportStockCount, needsRound:true},
  {id:'variance', name:'Variance Report', desc:'รายการที่ผลต่างไม่ตรงของรอบที่เลือก พร้อมเหตุผล', fn:reportVariance, needsRound:true},
  {id:'expiry', name:'Expiry Report', desc:'สินค้าใกล้หมดอายุ/หมดอายุแล้ว ทั้งหมด', fn:reportExpiry, needsRound:false},
  {id:'nonmoving', name:'Non-Moving Stock Report', desc:'สินค้าไม่เคลื่อนไหวเกิน 30 วัน เรียงตามมูลค่า', fn:reportNonMoving, needsRound:false},
  {id:'valuation', name:'Stock Valuation Report', desc:'มูลค่าสต็อกทั้งหมดรายรายการ', fn:reportValuation, needsRound:false},
];

function renderExport(container){
  container.appendChild(el('div','section-title','เลือกรายงานที่ต้องการ Export<div class="line"></div>'));
  if(!ACTIVE_ROUND){
    container.appendChild(el('div','footer-note','ยังไม่มีรอบนับที่เลือกอยู่ — รายงาน Stock Count / Variance จะว่างเปล่าจนกว่าจะสร้างรอบนับ'));
  }
  const grid = el('div','report-grid');
  REPORTS.forEach(rep=>{
    const card = el('div','report-card');
    card.innerHTML = `<div class="rt">📄 ${rep.name}</div><div class="rd">${rep.desc}</div>`;
    const {rows} = rep.fn();
    card.appendChild(el('div','rrow',`${rows.length} แถว ${rep.needsRound && ACTIVE_ROUND ? '· รอบ '+ACTIVE_ROUND : ''}`));
    const actions = el('div','report-actions');
    const btnCsv = el('button','btn','CSV');
    const btnXlsx = el('button','btn','Excel');
    const btnPdf = el('button','btn','PDF');
    btnCsv.onclick = ()=>{ const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;} exportCSV(title.replace(/\s+/g,'_')+'.csv', headers, rows); logAudit('Export CSV', '-', title); toast('ดาวน์โหลด CSV แล้ว','success'); };
    btnXlsx.onclick = ()=>{
      if(!window.XLSX){ toast('ไลบรารี Excel ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง','error'); return; }
      const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;}
      exportXLSX(title.replace(/\s+/g,'_')+'.xlsx', headers, rows, rep.name.slice(0,28));
      logAudit('Export Excel', '-', title); toast('ดาวน์โหลด Excel แล้ว','success');
    };
    btnPdf.onclick = ()=>{ const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;} exportPrintPDF(title, headers, rows); logAudit('Export PDF (Print)', '-', title); };
    actions.appendChild(btnCsv); actions.appendChild(btnXlsx); actions.appendChild(btnPdf);
    card.appendChild(actions);
    grid.appendChild(card);
  });
  container.appendChild(grid);
  container.appendChild(el('div','footer-note','<b>หมายเหตุ:</b> ปุ่ม "PDF" จะเปิดหน้าต่างใหม่พร้อมเปิดกล่องพิมพ์ของเบราว์เซอร์ให้อัตโนมัติ — เลือกปลายทางเป็น "Save as PDF" เพื่อบันทึกเป็นไฟล์ PDF (วิธีนี้แสดงผลภาษาไทยได้ถูกต้อง 100% ต่างจากการสร้าง PDF ตรงๆ ที่มักมีปัญหาฟอนต์ภาษาไทย)'));
}

function renderNav(){
  const el2 = document.getElementById('nav'); el2.innerHTML='';
  NAV.forEach(g=>{
    el2.appendChild(el('div','nav-group-label',g.group));
    g.items.forEach(it=>{
      const d = el('div','nav-item'+(state.tab===it.id?' active':''), `<span class="dot"></span><span>${it.label}</span>`);
      d.onclick = ()=>{ state.tab = it.id; render(); };
      el2.appendChild(d);
    });
  });
}

async function render(){
  renderNav();
  document.getElementById('fLocation').value = state.location;
  document.getElementById('fCategory').value = state.category;
  document.getElementById('fStatus').value = state.status;
  const [title,sub] = TITLES[state.tab];
  document.getElementById('pageTitle').innerHTML = title + `<span class="sub">${sub}</span>`;
  const content = document.getElementById('content');
  content.innerHTML = '';
  const section = el('div','section active');
  content.appendChild(section);
  const fn = {dashboard:renderDashboard, value:renderValue, expiry:renderExpiry, nonmoving:renderNonMoving,
    counts:renderCounts, mobile:renderMobile, review:renderReview, variance:renderVariance, audit:renderAudit,
    import:renderImport, export:renderExport}[state.tab];
  await fn(section);
  renderIdentityBar();
}
